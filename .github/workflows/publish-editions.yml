{
  "name": "Publish Lite / Full split release",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "voice-release-publish",
    "cancel-in-progress": false
  },
  "jobs": {
    "publish": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 45,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Check out official marketplace rules",
          "uses": "actions/checkout@v4",
          "with": {
            "repository": "siyuan-note/bazaar",
            "ref": "2eb2c3d0bf7fc6b6c8d442c34748d5a880865be3",
            "path": "marketplace-rules"
          }
        },
        {
          "uses": "actions/setup-go@v5",
          "with": {
            "go-version-file": "marketplace-rules/go.mod",
            "cache": false
          }
        },
        {
          "name": "Build official marketplace checker",
          "run": "mkdir -p marketplace-rules/cmd/voice-release-check\ncp .github/scripts/check-bazaar-package.go marketplace-rules/cmd/voice-release-check/main.go\ncd marketplace-rules\ngo build -o \"$RUNNER_TEMP/check-bazaar-package\" ./cmd/voice-release-check\n"
        },
        {
          "name": "Assemble and verify Full packages from public resources",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "OVERLAY_SHA256": "2734b11ca5a7030e6b1d34ccc07dc06a8fa8afbc601ffa2aa89fb5b667d0305c",
            "BAZAAR_CHECKER": "${{ runner.temp }}/check-bazaar-package"
          },
          "run": "python3 .github/scripts/assemble-public-release.py"
        }
      ]
    }
  }
}
